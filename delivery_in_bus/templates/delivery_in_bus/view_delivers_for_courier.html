{% extends 'base.html'%}
<title>{% block title %} Отправка заказов: {% endblock %}</title>
{% block body %}


{% if object_list.count > 0 %}
<h2>Завершённые доставки: </h2>
<div class="row">
    <div class="col-md-12">
        <table class="table table-striped table-hover">
            <thead>
            <tr>
                <th>№</th>
                <th>Дата доставки</th>
            </thead>
            <tbody>
            {% for order in object_list %}
            <td><button type="submit" class="btn btn-primary"

                onClick="location.href='{% url 'delivery_in_bus:detail_delivery' order.id %}'">Доставка № {{ order.id }}</button></td>

                <td>{{ order.created_at }}</td>

                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endif %}
{% endblock %}
