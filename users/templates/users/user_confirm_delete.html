{% extends "base.html" %}
{% block title %}Удаление пользователя{% endblock %}
{% block body %}
<!--FOR MANGER -->
{% if request.user.role == 'MANAGER' %}


 <h1>Удалить Пользователя</h1>

<form method="post">{% csrf_token %}
    <p>Вы действительно хотите удалить пользователя "{{ object }}" ?</p>
    {{ form }}
    <input type="submit" value="Подтвердить удаление">
</form>
{% endif %}
{% endblock %}
