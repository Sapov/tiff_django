<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Готовность заказа</title>
    <style>
        /* Базовые сбросы для email */
        body {
            margin: 0;
            padding: 0;
            min-width: 100%;
            width: 100% !important;
            height: 100%;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            font-family: Arial, sans-serif;
            line-height: 1.4;
            background-color: #e6f2ff; /* очень светлый голубой фон вокруг письма */
        }
        table {
            border-collapse: collapse;
            mso-table-lspace: 0;
            mso-table-rspace: 0;
        }
        td {
            border-collapse: collapse;
        }
        /* Адаптивность */
        @media only screen and (max-width: 600px) {
            .container {
                width: 100% !important;
            }
            .content {
                padding: 15px !important;
            }
            .btn {
                display: block !important;
                width: auto !important;
                margin-bottom: 10px !important;
            }
        }
    </style>
</head>
<body style="margin:0; padding:0; background-color:#e6f2ff; font-family:Arial, sans-serif; line-height:1.4;">
    <!-- Центрирующий контейнер -->
    <table width="100%" border="0" cellpadding="0" cellspacing="0" align="center" bgcolor="#e6f2ff" style="background-color:#e6f2ff;">
        <tr>
            <td align="center" style="padding:20px 10px;">
                <!-- Основная таблица письма (фиксированная ширина 600px для десктопа) -->
                <table class="container" width="600" border="0" cellpadding="0" cellspacing="0" align="center" bgcolor="#ffffff" style="width:100%; max-width:600px; background-color:#ffffff; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.05);">
                    <tr>
                        <td align="center" style="padding:0;">
                            <!-- ===== ШАПКА (голубая) ===== -->
                            <table width="100%" border="0" cellpadding="0" cellspacing="0" bgcolor="#4a9eff" style="background-color:#4a9eff; border-radius:8px 8px 0 0;">
                                <tr>
                                    <td align="center" style="padding:20px 20px;">
                                        <h1 style="color:#ffffff; font-size:20px; margin:0; font-weight:normal;">Дата готовности {{data_order_complete}}</h1>
                                    </td>
                                </tr>
                            </table>

                            <!-- ===== ОСНОВНОЙ БЛОК (белый) ===== -->
                            <table width="100%" border="0" cellpadding="0" cellspacing="0" bgcolor="#ffffff">
                                <tr>
                                    <td align="center" style="padding:30px 20px 20px;">
                                        <!-- Логотип -->
                                        <img src="https://www.san-cd.ru/wp-content/themes/sancd/images/logo-trans.png" alt="San-CD" width="140" style="display:block; margin-bottom:20px; border:0;">
                                        <!-- Номер заказа -->
                                        <h2 style="color:#1d2120; font-size:28px; margin:0 0 15px; font-weight:normal;">Вы оформили заказ № {{order_id}}</h2>
                                    </td>
                                </tr>
                                <tr>
                                    <td align="left" style="padding:0 20px 20px;">
                                        <!-- Список товаров -->
                                        <p style="color:#222222; font-size:16px; margin:0 0 15px;"><strong>Состав заказа:</strong></p>
                                        <table width="100%" border="0" cellpadding="8" cellspacing="0" style="border-top:1px solid #d9e6f2; border-bottom:1px solid #d9e6f2;">
                                            {% for i in items_in_order %}
                                            <tr>
                                                <td style="color:#222222; font-size:15px; border-bottom:1px solid #eef5fa;">{{i}}</td>
                                            </tr>
                                            {% endfor %}
                                        </table>
                                    </td>
                                </tr>
                                <!-- ===== КНОПКИ ===== -->
                                <tr>
                                    <td align="center" style="padding:30px 20px;">
                                        <!--[if mso]>
                                        <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{order_archive_link}}" style="height:44px;v-text-anchor:middle;width:180px;" arcsize="10%" stroke="f" fillcolor="#1e88e5">
                                            <w:anchorlock/>
                                            <center style="color:#ffffff; font-family:Arial, sans-serif; font-size:16px; font-weight:bold;">Скачать</center>
                                        </v:roundrect>
                                        <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{confirm_link}}" style="height:44px;v-text-anchor:middle;width:180px;" arcsize="10%" stroke="f" fillcolor="#42a5f5">
                                            <w:anchorlock/>
                                            <center style="color:#ffffff; font-family:Arial, sans-serif; font-size:16px; font-weight:bold;">Принял в работу</center>
                                        </v:roundrect>
                                        <br>
                                        <![endif]-->
                                        <!--[if !mso]><!-->
                                        <a href="{{order_archive_link}}" class="btn" style="display:inline-block; background-color:#1e88e5; color:#ffffff; text-decoration:none; font-size:16px; font-weight:bold; padding:12px 24px; border-radius:30px; margin:0 8px 10px; box-shadow:0 2px 6px rgba(0,0,0,0.1);">Скачать</a>
                                        <a href="{{confirm_link}}" class="btn" style="display:inline-block; background-color:#42a5f5; color:#ffffff; text-decoration:none; font-size:16px; font-weight:bold; padding:12px 24px; border-radius:30px; margin:0 8px 10px; box-shadow:0 2px 6px rgba(0,0,0,0.1);">Принял в работу</a>
                                        <!--<![endif]-->
                                    </td>
                                </tr>
                            </table>

                            <!-- ===== ПОДВАЛ (светло-голубой) ===== -->
                            <table width="100%" border="0" cellpadding="0" cellspacing="0" bgcolor="#e3f0ff" style="background-color:#e3f0ff; border-radius:0 0 8px 8px;">
                                <tr>
                                    <td align="center" style="padding:20px;">
                                        <p style="color:#2c3e50; font-size:12px; margin:0 0 5px;">Компания: www.san-cd.ru</p>
                                        <p style="color:#2c3e50; font-size:12px; margin:0;">Телефон: +7 953 119 33 67</p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
                <!-- Конец основной таблицы письма -->
            </td>
        </tr>
    </table>
</body>
</html>
```
