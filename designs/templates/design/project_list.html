{% extends "base.html" %}

{% block content %}
<h1>Мои проекты</h1>
<ul>
    {% for project in projects %}
        <li>
            <a href="{% url 'project_detail' project.id %}">{{ project.title }}</a>
            (Клиент: {{ project.client.username }}, Дизайнер: {{ project.designer.username }})
        </li>
    {% endfor %}
</ul>
{% endblock %}
