{% for comment in comments %}
<div class="mb-3 {% if comment.author == request.user %}text-end{% endif %}">
    <div class="d-flex {% if comment.author == request.user %}justify-content-end{% endif %}">
        <div class="{% if comment.author == request.user %}bg-primary text-white{% else %}bg-light{% endif %} rounded p-3" style="max-width: 70%;">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <strong>{{ comment.author.get_full_name }}</strong>
                <small class="text-muted">{{ comment.created_at|date:"H:i" }}</small>
            </div>
            {% if comment.text %}<p class="mb-2">{{ comment.text }}</p>{% endif %}
            {% if comment.image %}
            <div class="mt-2">
                <img src="{{ comment.image.url }}" class="img-thumbnail" style="max-height: 200px;" alt="Прикрепленное изображение">
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endfor %}
