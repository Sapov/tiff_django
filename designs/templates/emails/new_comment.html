<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Новый комментарий</title>
</head>
<body>
    <h2>Здравствуйте, {{ recipient.first_name }}!</h2>
    <p>Пользователь {{ author.username }} оставил новый комментарий к проекту <strong>{{ project.title }}</strong>:</p>

    <div style="background: #f5f5f5; padding: 15px; border-radius: 5px; margin: 15px 0;">
        {{ comment.text }}
    </div>

    <p>Дата: {{ comment.created_at|date:"d.m.Y H:i" }}</p>

    <a href="{{ design_url }}" style="display: inline-block; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 5px;">
        Перейти к проекту
    </a>

    <p style="margin-top: 20px; color: #666;">
        Это автоматическое уведомление. Пожалуйста, не отвечайте на это письмо.
    </p>
</body>
</html>
