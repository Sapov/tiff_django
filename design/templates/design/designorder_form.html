
{% extends 'kb/base_kb.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container">
    <h2>{% if object %}Редактировать статью{% else %}Бриф для создания макета{% endif %}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form|crispy }}

        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
</div>
{% endblock %}
