version: '2'

services:
  redis:
    image: redis
    restart: always
    ports:
      - "6379:6379"

  postgres_db:
    image: postgres:15
    container_name: postgres_db
    volumes:
      - ~/.pg/pg_data/django:/var/lib/postgresql/data
    env_file:
      - .env
    restart: always

  django_project:
    build:
      dockerfile: Dockerfile
      context: .
    image: django_docker:latest
    container_name: django_docker
    depends_on:
      - postgres_db
    volumes:
      - static_volume:/django/static
      - media_volume:/django/media
    env_file:
      - .env

    command: >
      bash -c "./manage.py collectstatic --noinput && ./manage.py makemigrations && ./manage.py migrate && ./manage.py add_price && gunicorn -b 0.0.0.0:8000 mysite.wsgi:application"
    restart: always
  worker:
    restart: always
    build: .
    volumes:
      - /:/app
      - static_volume:/django/static
      - media_volume:/django/media
    depends_on:
      - redis
      - django_project
    command: 'celery -A mysite worker -l info'

  celery-beat:
    restart: always
    build: .
    volumes:
      - /:/app
      - static_volume:/django/static
      - media_volume:/django/media
    depends_on:
      - redis
      - django_project
    command: 'celery -A mysite beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler'

  flower:
    container_name: flower
    build: .
    ports:
      - 5555:5555
    volumes:
      - /:/app
      - static_volume:/django/static
      - media_volume:/django/media
    depends_on:
      - redis
    command: 'celery -A mysite flower'


volumes:
  static_volume:
  media_volume:
  certs:
  vhost:
  html:
  acme: