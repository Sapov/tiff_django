upstream django {
    server django_project:8000;  # Имя сервиса Django из docker-compose
}

server {
    listen 80;
    server_name localhost;

    # Статические файлы
    location /static/ {
        alias /static/;  # Путь внутри контейнера Nginx (должен совпадать с volume)
        expires 30d;
        add_header Cache-Control "public";
    }

    # Медиа-файлы
    location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Динамические запросы -> Gunicorn
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}